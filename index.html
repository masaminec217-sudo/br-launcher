<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Перекуп Авто 3D Cinema</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;background:#0a0c10;color:#fff;}
body[data-theme="dark"]{--bg:#0f1115;--surface:#1a1d24;--surface2:#232833;--text:#e8eaed;--muted:#8b93a3;--accent:#4a9eff;--accent-soft:rgba(74,158,255,.14);--good:#3ecf8e;--warn:#ffb03e;--bad:#ff6b6b;--border:rgba(255,255,255,.08);--home-text:#fff;--home-sub:rgba(255,255,255,.62);--glass:rgba(255,255,255,.1);--wall:linear-gradient(165deg,#1b2434,#2a1f38 55%,#141a26);}
body[data-theme="light"]{--bg:#f2f4f8;--surface:#fff;--surface2:#eef1f6;--text:#141821;--muted:#6b7382;--accent:#2f7fd6;--accent-soft:rgba(47,127,214,.12);--good:#1fa564;--warn:#d98a1a;--bad:#d94b4b;--border:rgba(0,0,0,.08);--home-text:#131722;--home-sub:rgba(20,25,35,.55);--glass:rgba(255,255,255,.55);--wall:linear-gradient(165deg,#dbe6f5,#f0e2ec 55%,#dfeaf8);}
#mode-2d,#mode-3d{position:fixed;inset:0;width:100vw;height:100vh;display:none;}
#mode-2d.active,#mode-3d.active{display:block;}
body[data-device="phone"] #mode-2d.active{display:flex;justify-content:center;align-items:center;}
.phone{position:relative;width:390px;height:844px;border-radius:56px;background:#0a0c10;padding:12px;margin:auto;box-shadow:0 40px 90px rgba(0,0,0,.65);}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#000;}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:114px;height:31px;border-radius:16px;background:#000;z-index:950;}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:800;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 0;font-size:13px;font-weight:600;pointer-events:none;color:var(--home-text);}
.statusbar.on-app{color:var(--text);}
.batt{width:22px;height:11px;border:1.4px solid currentColor;border-radius:3px;position:relative;}
.batt i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;background:currentColor;border-radius:1.5px;display:block;}
.home{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--wall);}
.home-header{padding:58px 22px 8px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;}
.hh-nick{font-size:15px;font-weight:700;color:var(--home-text);}
.hh-cap{font-size:22px;font-weight:800;color:var(--home-text);margin-top:2px;}
.hh-sub{font-size:11px;color:var(--home-sub);margin-top:3px;}
.hh-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--glass);border:1px solid rgba(255,255,255,.18);}
.app-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:18px 14px;align-content:start;position:relative;z-index:2;overflow-y:auto;}
.app-ic{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.app-ic .glyph{width:56px;height:56px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 6px 16px rgba(0,0,0,.28);position:relative;overflow:hidden;}
.app-ic .glyph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);}
.app-ic .lbl{font-size:10.5px;color:var(--home-text);font-weight:600;}
.dock{margin:0 12px 8px;padding:10px 6px;border-radius:26px;background:var(--glass);border:1px solid rgba(255,255,255,.14);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative;z-index:2;}
.dock .app-ic .lbl{display:none;}
.home-bar{height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;z-index:2;}
.home-bar i{width:132px;height:5px;border-radius:3px;background:var(--home-text);opacity:.85;display:block;}
.app-view{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:600;color:var(--text);}
.app-view.open{display:flex;}
.app-top{padding:54px 14px 10px;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;}
.back-btn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;background:var(--surface2);color:var(--accent);font-size:22px;display:flex;align-items:center;justify-content:center;font-weight:600;}
.app-title{font-size:17px;font-weight:700;flex:1;cursor:default;user-select:none;}
.app-body{flex:1;overflow-y:auto;padding:12px 14px 40px;}
.app-body::-webkit-scrollbar{width:0;}
.card{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--border);}
.card.tight{padding:11px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.muted{color:var(--muted);font-size:12px;}
.small{font-size:11.5px;}
.big{font-size:26px;font-weight:800;}
.bold{font-weight:700;}
.good{color:var(--good);}.bad{color:var(--bad);}.warn{color:var(--warn);}
.center{text-align:center;}
.btn{border:none;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;font-family:inherit;}
.btn.sec{background:var(--surface2);color:var(--text);}
.btn.good{background:var(--good);color:#fff;}
.btn.bad{background:var(--bad);color:#fff;}
.btn.warn{background:var(--warn);color:#000;}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px;}
.btn.full{width:100%;}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;flex:1;}
.bar i{display:block;height:100%;border-radius:3px;}
.bar-line{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11.5px;}
.bar-line span:first-child{width:74px;color:var(--muted);}
.bar-line span:last-child{width:36px;text-align:right;font-weight:700;}
.input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;outline:none;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);}
.pill.on{background:var(--accent-soft);color:var(--accent);}
.car-emoji{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--surface2);flex:0 0 auto;}
.badge{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px;line-height:1.6;}
.empty .e-ic{font-size:40px;display:block;margin-bottom:10px;opacity:.5;}
.push-wrap{position:absolute;top:0;left:0;right:0;z-index:900;padding:52px 12px 0;pointer-events:none;}
.push{background:rgba(28,32,42,.94);color:#fff;border-radius:18px;padding:11px 13px;display:flex;gap:10px;align-items:center;margin-bottom:8px;transform:translateY(-140%);opacity:0;transition:all .4s;}
.push.show{transform:translateY(0);opacity:1;}
.push-ic{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;}
.push-t{font-size:12.5px;font-weight:700;}
.push-d{font-size:11.5px;opacity:.8;}
.modal-wrap{position:absolute;inset:0;z-index:920;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:24px;}
.modal-wrap.show{display:flex;}
.modal{background:var(--surface);border-radius:22px;padding:20px;width:100%;max-width:320px;color:var(--text);border:1px solid var(--border);max-height:80vh;overflow-y:auto;}
.modal h3{margin:0 0 8px;font-size:17px;}
.modal p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.5;}
.modal .btn-row{margin-top:14px;}
.modal .btn-row .btn{flex:1;}
.float-wrap{position:absolute;inset:0;pointer-events:none;z-index:910;overflow:hidden;}
.float-money{position:absolute;bottom:30%;font-size:24px;font-weight:800;color:var(--good);animation:floatUp 1.6s ease-out forwards;}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0;}20%{transform:translateY(-14px) scale(1.1);opacity:1;}100%{transform:translateY(-130px) scale(1);opacity:0;}}
.drive-btn{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff8a4a,#ff6b6b);color:#fff;padding:14px 28px;border-radius:16px;font-size:14px;font-weight:800;border:none;cursor:pointer;box-shadow:0 12px 32px rgba(255,107,107,.5);z-index:100;font-family:inherit;}
.drive-btn:active{transform:translateX(-50%) scale(.95);}
@media (max-width:440px),(max-height:900px){
  .phone{width:100vw;height:100vh;border-radius:0;padding:0;box-shadow:none;}
  .screen{border-radius:0;}
  .island{top:6px;}
  .statusbar{padding-top:10px;}
  .home-header{padding-top:52px;}
  .app-top{padding-top:48px;}
}
#mode-3d{background:#000;}
#mode-3d canvas{display:block;position:absolute;inset:0;}
.hud3d{position:absolute;top:0;left:0;right:0;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:50;pointer-events:none;font-weight:700;color:#fff;}
.hud3d-money{font-size:16px;text-shadow:0 2px 8px rgba(0,0,0,.9);}
.hud3d-speed{font-size:24px;text-shadow:0 2px 8px rgba(0,0,0,.9);color:#4a9eff;}
.hud3d-speed small{font-size:12px;opacity:.7;}
.hud3d-right{display:flex;gap:8px;pointer-events:auto;}
.hud3d-btn{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15);color:#fff;width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.hud3d-btn.home{background:linear-gradient(135deg,#4a9eff,#2f7fd6);border-color:transparent;}
.minimap{position:absolute;top:70px;right:16px;width:120px;height:120px;background:rgba(0,0,0,.55);border-radius:14px;border:1px solid rgba(255,255,255,.15);z-index:50;overflow:hidden;}
.minimap canvas{position:absolute;inset:0;width:100%;height:100%;}
.controls3d{position:absolute;bottom:20px;left:0;right:0;padding:0 20px;display:flex;justify-content:space-between;align-items:flex-end;z-index:50;pointer-events:none;}
.controls3d > div{pointer-events:auto;}
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px;}
.dpad button{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:14px;font-size:24px;font-weight:800;cursor:pointer;font-family:inherit;}
.dpad .up{grid-column:2;grid-row:1;}.dpad .left{grid-column:1;grid-row:2;}.dpad .right{grid-column:3;grid-row:2;}.dpad .down{grid-column:2;grid-row:3;}
.pedals{display:flex;flex-direction:column;gap:8px;}
.pedals button{width:80px;height:80px;border-radius:50%;font-size:20px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.2);cursor:pointer;font-family:inherit;}
.pedal-gas{background:rgba(62,207,142,.55);}.pedal-brake{background:rgba(255,107,107,.55);}
.garage-prompt{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#3ecf8e,#1fa564);color:#fff;padding:14px 28px;border-radius:14px;font-size:15px;font-weight:800;z-index:60;box-shadow:0 8px 24px rgba(62,207,142,.5);display:none;border:none;cursor:pointer;font-family:inherit;}
.garage-prompt.show{display:block;}
.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%) translateY(-150%);background:rgba(28,32,42,.95);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:700;z-index:300;transition:transform .4s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.loading3d{position:absolute;inset:0;background:linear-gradient(160deg,#0a0c10,#1a1f2e);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;color:#fff;}
.loading3d h1{font-size:24px;color:#4a9eff;}
.loading3d .bar{width:200px;height:6px;background:#232833;border-radius:3px;overflow:hidden;margin-top:20px;}
.loading3d .bar i{display:block;height:100%;background:#4a9eff;width:0%;transition:width .3s;}
.device-picker,.city-picker{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#0a0c10,#1a1f2e);display:none;align-items:center;justify-content:center;padding:20px;}
.device-picker.show,.city-picker.show{display:flex;}
.dp-content,.cp-content{text-align:center;max-width:640px;width:100%;color:#fff;}
.dp-logo{font-size:64px;margin-bottom:12px;}
.dp-title,.cp-content h1{font-size:28px;font-weight:800;margin:0 0 8px;}
.cp-content h1{color:#4a9eff;font-size:24px;}
.dp-sub,.cp-sub{font-size:15px;opacity:.6;margin:0 0 32px;}
.dp-options,.cp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
@media (max-width:520px){.dp-options,.cp-grid{grid-template-columns:1fr;}}
.dp-option,.cp-card{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.12);border-radius:20px;padding:26px 20px;color:#fff;cursor:pointer;font-family:inherit;text-align:center;}
.dp-option:active,.cp-card:active{background:rgba(74,158,255,.15);border-color:#4a9eff;}
.dp-icon,.cp-ic{font-size:52px;margin-bottom:10px;}
.cp-ic{font-size:44px;}
.dp-name,.cp-name{font-size:19px;font-weight:800;margin-bottom:5px;}
.cp-name{font-size:17px;}
.dp-desc,.cp-desc{font-size:12.5px;opacity:.6;}
.cp-desc{font-size:11.5px;}
.cinema-bars{position:absolute;left:0;right:0;background:#000;z-index:80;pointer-events:none;height:0;transition:height .6s ease;}
.cinema-bars.top{top:0;}
.cinema-bars.bottom{bottom:0;}
body[data-cinema="on"] .cinema-bars.top,
body[data-cinema="on"] .cinema-bars.bottom{height:60px;}
.cinema-overlay{position:absolute;inset:0;pointer-events:none;z-index:70;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%),linear-gradient(180deg,rgba(255,180,100,.10),transparent 30%,transparent 70%,rgba(0,50,100,.15));transition:opacity .5s;}
body[data-cinema="off"] .cinema-overlay{opacity:0;}
.cinema-grain{position:absolute;inset:0;pointer-events:none;z-index:75;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
body[data-cinema="off"] .cinema-grain{opacity:0;}
.cinema-btn{position:absolute;top:120px;right:16px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15);color:#fff;width:44px;height:44px;border-radius:12px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:85;font-family:inherit;}
.cinema-btn.on{background:linear-gradient(135deg,#ffd23e,#ff8a4a);border-color:transparent;color:#000;}
.city-tag{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;z-index:85;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);}
</style>

function genCar(model){
  const m = model || pick(CAR_MODELS);
  const year = rndI(m.y1,m.y2);
  const age = Math.max(0,new Date().getFullYear()-year);
  const km = Math.round(age*rndI(7000,23000)*rnd(0.6,1.4));
  const cond = {engine:rndI(22,98),body:rndI(22,98),interior:rndI(28,98),suspension:rndI(22,98)};
  const avg = (cond.engine+cond.body+cond.interior+cond.suspension)/4;
  const ageF = Math.max(0.1,Math.pow(m.dep,age));
  const kmF = clamp(1-km/950000,0.72,1);
  const condF = 0.34+(avg/100)*0.78;
  let base = m.p*ageF*kmF*condF*rnd(0.86,1.14)*(S.market.carMod||1);
  const price = Math.max(15000,Math.round(base/500)*500);
  return {id:S.idc++,brand:m.b,model:m.m,ic:m.ic,tier:m.tier,base:m.p,dep:m.dep,year,km,cond,price,expired:Date.now()+rndI(90,260)*1000,diagnosed:false};
}
function marketValue(car){
  const age = Math.max(0,new Date().getFullYear()-car.year);
  const ageF = Math.max(0.1,Math.pow(car.dep,age));
  const kmF = clamp(1-car.km/950000,0.72,1);
  const avg = (car.cond.engine+car.cond.body+car.cond.interior+car.cond.suspension)/4;
  const condF = 0.34+(avg/100)*0.78;
  let v = car.base*ageF*kmF*condF*(S.market.carMod||1);
  let bonus = 0;
  if(car.clean)bonus+=0.03;
  if(car.photo)bonus+=0.05;
  v *= (1+bonus);
  if(S.vip&&Date.now()<S.vipUntil)v*=1.10;
  return Math.round(v);
}
function readiness(car){
  const avg=(car.cond.engine+car.cond.body+car.cond.interior+car.cond.suspension)/4;
  let r=avg;
  if(car.clean)r+=5;
  if(car.photo)r+=5;
  return clamp(Math.round(r),0,100);
}
function netWorth(){
  let t = S.balance;
  S.cars.forEach(c=>t+=marketValue(c));
  S.listings.forEach(l=>t+=marketValue(l.car));
  if(S.loan)t-=S.loan.remaining;
  return t;
}
function level(){return clamp(Math.floor(1+Math.sqrt(S.dealsSold*3+S.dealsBought*2)*0.9),1,50);}

function push(title,text,icon){

  const el = document.createElement('div');
  el.className='push';

  w.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),450);},3500);
}

function showModal(opts){
  const wrap = $('#modal-wrap');if(!wrap)return;
  wrap.innerHTML='';

  m.className='modal';
  m.innerHTML=`<h3>${opts.title||''}</h3>${opts.html||''}`;
  const br = document.createElement('div');br.className='btn-row';
  (opts.buttons||[{t:'OK',cls:'',fn:()=>{}}]).forEach(b=>{
    const btn = document.createElement('button');
    btn.className='btn '+(b.cls||'');
    btn.textContent=b.t;
    btn.onclick=()=>{if(b.keepOpen!==true)closeModal();if(b.fn)b.fn();};
    br.appendChild(btn);
  });

}

function toast(text){

function shade(hex,amt){
  let c = hex.replace('#','');
  if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  r=clamp(r+amt,0,255);g=clamp(g+amt,0,255);b=clamp(b+amt,0,255);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function buildHome(){
  const grid = $('#app-grid');if(!grid)return;

    const el = document.createElement('div');el.className='app-ic';
    el.innerHTML=`<div class="glyph" style="background:linear-gradient(160deg,${a.c},${shade(a.c,-28)})">${a.ic}</div><div class="lbl">${a.n}</div>`;
    el.addEventListener('click',()=>openApp(a.id,el));
    grid.appendChild(el);
  });
  const dock = $('#dock');
  if(dock){dock.innerHTML='';
    DOCK.forEach(id=>{
      const a = APPS.find(x=>x.id===id);
      const el = document.createElement('div');el.className='app-ic';
      el.innerHTML=`<div class="glyph" style="background:linear-gradient(160deg,${a.c},${shade(a.c,-28)})">${a.ic}</div>`;
      el.addEventListener('click',()=>openApp(a.id,el));
      dock.appendChild(el);
    });
  }
  const hb = $('#home-bar');if(hb)hb.addEventListener('click',closeApp);
}
function buildApps(){
  const wrap = $('#apps');if(!wrap)return;
  wrap.innerHTML='';
  APPS.forEach(a=>{
    const v = document.createElement('div');
    v.className='app-view';v.id='app-'+a.id;
    v.innerHTML=`<div class="app-top"><button class="back-btn" data-close="1">‹</button><div class="app-title" id="title-${a.id}">${a.n}</div></div><div class="app-body" id="body-${a.id}"></div>`;
    wrap.appendChild(v);
  });
  wrap.addEventListener('click',e=>{
    if(e.target.closest('[data-close]')){closeApp();return;}
    const t = e.target.closest('[data-act]');
    if(t)handleAction(t.dataset.act,t.dataset.id,t);
  });
}
function openApp(id){
  if(currentApp){
    const p=document.getElementById('app-'+currentApp);
    if(p){p.classList.remove('open');p.style.display='none';}
  }
  const view = document.getElementById('app-'+id);if(!view)return;
  view.style.display='flex';view.classList.add('open');
  currentApp = id;
  const sb = $('#statusbar');if(sb)sb.classList.add('on-app');
  renderApp(id);
}
function closeApp(){
  if(!currentApp)return;
  const v = document.getElementById('app-'+currentApp);
  if(v){v.classList.remove('open');v.style.display='none';}
  currentApp = null;
  const sb = $('#statusbar');if(sb)sb.classList.remove('on-app');
  renderHomeHeader();
}

}

function handleAction(act,id,el){
  const nid = Number(id);
  switch(act){
    case 'startDay':{
      const now = Date.now();
      if(S.nextOfferAt>now){toast('Подождите '+Math.ceil((S.nextOfferAt-now)/1000)+'с');return;}
      for(let i=0;i<3;i++)S.offers.push(genCar(pick(CAR_MODELS)));
      S.nextOfferAt=now+60000;
      push('🌅 День начался','3 новых машины','🚗');renderApp('home');break;
    }
    case 'diagnose':{
      const c = S.offers.find(x=>x.id===nid);
      if(!c||S.balance<5000)return;
      S.balance-=5000;c.diagnosed=true;renderMarket();renderHomeHeader();break;
    }
    case 'buyCar':{
      const c = S.offers.find(x=>x.id===nid);if(!c)return;
      if(S.cars.length>=S.garageLimit){toast('🏚️ Гараж полон');return;}
      if(S.balance<c.price){toast('💸 Не хватает');return;}
      S.balance-=c.price;S.dealsBought++;
      S.offers=S.offers.filter(x=>x.id!==nid);
      const car = Object.assign({},c);
      delete car.price;delete car.expired;delete car.diagnosed;
      car.boughtFor=c.price;car.clean=false;car.photo=false;
      S.cars.push(car);
      if(S.cars.length>S.stats.maxGarage)S.stats.maxGarage=S.cars.length;
      floatMoney('−'+money(c.price),'var(--bad)');
      push('🚗 Куплено',`${car.brand} ${car.model}`,'🚗');
      renderAll();break;
    }
    case 'expandGarage':{
      if(S.balance<1500000)return;
      S.balance-=1500000;S.garageLimit+=5;renderAll();break;
    }
    case 'repair':{
      const node = el.dataset.node;
      const car = S.cars.find(x=>x.id===nid);
      if(!car||car.repair)return;
      const cost = Math.round(NODES.find(x=>x.k===node).base*(1+(car.tier-1)*0.55)*(100-car.cond[node])/100*1.1/100)*100;
      if(S.balance<cost){toast('💸 '+money(cost));return;}
      S.balance-=cost;
      car.repair={node,end:Date.now()+rndI(8000,18000)};
      renderAll();break;
    }
    case 'wash':{
      const car = S.cars.find(x=>x.id===nid);if(!car||car.clean||S.balance<8000)return;
      S.balance-=8000;car.clean=true;renderAll();break;
    }
    case 'photo':{
      const car = S.cars.find(x=>x.id===nid);if(!car||car.photo||S.balance<5000)return;
      S.balance-=5000;car.photo=true;renderAll();break;
    }
    case 'toSale':{
      const car = S.cars.find(x=>x.id===nid);if(!car)return;
      if(car.repair){toast('🔧 Идёт ремонт');return;}
      const price = Math.round(marketValue(car)*1.10/1000)*1000;
      S.cars=S.cars.filter(x=>x.id!==nid);
      S.listings.push({id:S.idc++,car,price,nextBuyer:Date.now()+rndI(12,40)*1000,offers:[]});
      renderAll();break;
    }
    case 'dropPrice':{
      const l = S.listings.find(x=>x.id===nid);if(!l)return;
      l.price=Math.max(1000,Math.round(l.price*0.95/1000)*1000);
      l.offers=[];l.nextBuyer=Date.now()+rndI(8,25)*1000;renderAll();break;
    }
    case 'unsale':{
      const l = S.listings.find(x=>x.id===nid);if(!l)return;
      if(S.cars.length>=S.garageLimit){toast('🏚️ Полон');return;}
      S.listings=S.listings.filter(x=>x.id!==nid);S.cars.push(l.car);renderAll();break;
    }
    case 'acceptOffer':{
      const l = S.listings.find(x=>x.id===nid);if(!l)return;
      const o = l.offers.find(x=>x.id===Number(el.dataset.off));if(!o)return;
      completeSale(l,o.amount,o);break;
    }
    case 'doJob':{
      const j = JOBS.find(x=>x.id===id);if(!j)return;
      if(level()<j.lvl){toast('Нужен ур. '+j.lvl);return;}
      const pay = rndI(j.pay[0],j.pay[1]);
      S.balance+=pay;S.workEarned+=pay;S.stats.shifts++;
      floatMoney('+'+money(pay),'var(--good)');
      push('💼 Смена',`${j.n} · ${money(pay)}`,'💼');renderAll();break;
    }
    case 'takeLoan':{
      const amt = Math.max(50000, Math.round(Number($('#loan-amt').value)||0));
      S.balance += amt;
      S.loan = {amount:amt,remaining:Math.round(amt*1.1)};
      toast('Получено '+money(amt));renderAll();break;
    }
    case 'loanPay':{
      if(!S.loan||S.balance<S.loan.remaining){toast('💸 Не хватает');return;}
      S.balance-=S.loan.remaining;S.loan=null;renderAll();break;
    }
    case 'playDice':{
      const g = window._diceGuess;
      if(!g){toast('Выберите число');return;}
      const bet = Math.max(1000,Math.floor(Number($('#dice-bet').value)||1000));
      if(S.balance<bet){toast('💸 '+money(bet));return;}
      S.balance-=bet;
      const roll = rndI(1,6);
      if(roll===g){const w=bet*5;S.balance+=w;floatMoney('+'+money(w),'var(--good)');toast('🎉 +'+money(w));}
      else toast('🎲 Выпало '+roll);
      window._diceGuess=null;renderAll();break;
    }
    case 'toggleCinema':{
      S.cinema = !S.cinema;
      document.body.setAttribute('data-cinema', S.cinema ? 'on' : 'off');
      renderSettings();save();break;
    }
    case 'manualSave':save();toast('💾 Сохранено');break;
    case 'resetGame':{
      showModal({title:'🗑️ Сброс?',html:'<p>Введите <b>reset</b></p><input class="input" id="reset-w">',
        buttons:[{t:'Отмена',cls:'sec'},{t:'Сброс',cls:'bad',fn:()=>{
          const v = ($('#reset-w')||{}).value||'';
          if(v.trim().toLowerCase()==='reset'){localStorage.removeItem(SAVE_KEY);location.reload();}
          else toast('❌ Неверно');
        }}]});break;
    }
  }
}
function completeSale(listing,amount,buyer){
  const car = listing.car;
  const profit = amount-(car.boughtFor||0);
  S.balance+=amount;S.dealsSold++;S.totalEarned+=amount;
  if(profit>S.bestDeal)S.bestDeal=profit;
  S.listings=S.listings.filter(l=>l.id!==listing.id);
  floatMoney('+'+money(amount),'var(--good)');
  push('✅ Продано!',`+${money(amount)}`,'💰');
  renderAll();
}

function tick(){
  const now = Date.now();
  updateClock();
  S.offers = S.offers.filter(o=>o.expired>now);
  if(now>S.nextOfferAt && S.offers.length<10){
    for(let i=0;i<rndI(1,2);i++)S.offers.push(genCar(pick(CAR_MODELS)));
    S.nextOfferAt = now+rndI(60,180)*1000;
  }
  S.listings.forEach(l=>{
    if(now>=l.nextBuyer){trySpawnBuyer(l); l.nextBuyer = now+rndI(15,55)*1000;}
  });
  S.cars.forEach(c=>{
    if(c.repair && c.repair.end<=now){
      c.cond[c.repair.node]=clamp(c.cond[c.repair.node]+rndI(30,55),0,100);
      delete c.repair;S.stats.repairs++;
      push('✅ Ремонт готов',`${c.brand} ${c.model}`,'✅');
      if(currentApp==='garage')renderGarage();
    }
  });
  if(!window._lastSave || now-window._lastSave>10000){window._lastSave=now;save();}
}
function trySpawnBuyer(listing){
  const car = listing.car;
  const ratio = listing.price/marketValue(car);
  let bc = clamp(1.15-ratio,0.04,0.9);
  if(ratio>1.4)bc*=0.25;
  if(Math.random() > bc)return;
  let type = 'normal';
  const roll = Math.random();
  if(roll<0.42)type='greedy';
  else if(roll<0.85)type='normal';
  else type='generous';
  let amt;
  if(type==='greedy')amt=listing.price*rnd(0.72,0.90);
  else if(type==='generous')amt=listing.price*rnd(1.0,1.18);
  else amt=listing.price*rnd(0.93,1.0);
  amt = Math.round(amt/1000)*1000;
  const NAMES = ['Игорь','Светлана','Максим','Ольга','Николай','Елена'];
  listing.offers.push({id:S.idc++,name:pick(NAMES)+' '+pick(['П.','И.','С.']),type,amount:amt});
  if(listing.offers.length>3)listing.offers.shift();
  push('📞 Звонок',`${car.brand}: ${money(amt)}`,'📞');
  if(currentApp==='sale')renderSale();
}

function buildSkyDome(sky){
  const skyGeo = new THREE.SphereGeometry(400, 32, 15);
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {topColor:{value:new THREE.Color(sky.top)}, bottomColor:{value:new THREE.Color(sky.bottom)}, offset:{value:100}, exponent:{value:0.7}},
    vertexShader: `varying vec3 vWorldPosition; void main(){ vec4 worldPosition = modelMatrix * vec4(position, 1.0); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition; void main(){ float h = normalize(vWorldPosition + offset).y; gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0); }`,
    side: THREE.BackSide
  });
  scene3d.add(new THREE.Mesh(skyGeo, skyMat));
}
function buildClouds3d(){
  const mat1 = new THREE.MeshLambertMaterial({color: 0xffe4c4, transparent: true, opacity: 0.75, emissive: 0xffd4a0, emissiveIntensity: 0.4});
  const mat2 = new THREE.MeshLambertMaterial({color: 0xffcc99, transparent: true, opacity: 0.65, emissive: 0xffb070, emissiveIntensity: 0.3});
  for(let i=0;i<18;i++){
    const cloud = new THREE.Group();
    const mat = Math.random() < 0.5 ? mat1 : mat2;
    for(let j=0;j<rndI(4,6);j++){
      const s = rnd(5,11);
      const blob = new THREE.Mesh(new THREE.SphereGeometry(s, 8, 6), mat);
      blob.position.set(rnd(-10,10), rnd(-1.5,1.5), rnd(-5,5));
      blob.scale.y = 0.45;
      cloud.add(blob);
    }
    cloud.position.set(rnd(-220,220), rnd(55,90), rnd(-220,220));
    scene3d.add(cloud);
    clouds3d.push(cloud);
  }
}

function updateCar3d(dt){
  const cs = car3d;
  if(keys3d.gas||keys3d.up)cs.speed += cs.accel*dt;
  else if(keys3d.brake||keys3d.down){
    if(cs.speed>0)cs.speed -= cs.brakePower*dt;
    else cs.speed -= cs.accel*0.6*dt;
  } else {
    if(cs.speed>0)cs.speed = Math.max(0,cs.speed-cs.friction*dt);
    else if(cs.speed<0)cs.speed = Math.min(0,cs.speed+cs.friction*dt);
  }
  cs.speed = clamp(cs.speed,cs.maxReverse,cs.maxSpeed);
  const sf = clamp(Math.abs(cs.speed)/15,0,1);
  const td = cs.speed>=0?1:-1;
  if(keys3d.left)cs.yaw += cs.turnSpeed*sf*td*dt;
  if(keys3d.right)cs.yaw -= cs.turnSpeed*sf*td*dt;
  cs.x += Math.sin(cs.yaw)*cs.speed*dt;
  cs.z += Math.cos(cs.yaw)*cs.speed*dt;
  cs.x = clamp(cs.x,-170,170);
  cs.z = clamp(cs.z,-170,170);
  buildings3d.forEach(b=>{
    const dx = cs.x-b.x, dz = cs.z-b.z;
    const hw = b.w/2+1.5, hd = b.d/2+1.5;
    const ox = hw-Math.abs(dx), oz = hd-Math.abs(dz);
    if(ox>0 && oz>0){
      if(ox<oz)cs.x = b.x+(dx>0?1:-1)*hw;
      else cs.z = b.z+(dz>0?1:-1)*hd;
      cs.speed *= -0.3;
    }
  });
  const gx = 0, gz = -50, gw = 16, gd = 16;
  const doorZone = Math.abs(cs.x-gx)<3.5 && cs.z > gz+gd/2-2 && cs.z < gz+gd/2+6;
  if(!doorZone){
    const dx = cs.x-gx, dz = cs.z-gz;
    const hw = gw/2+1.2, hd = gd/2+1.2;
    const ox = hw-Math.abs(dx), oz = hd-Math.abs(dz);
    if(ox>0 && oz>0){
      if(ox<oz)cs.x = gx+(dx>0?1:-1)*hw;
      else cs.z = gz+(dz>0?1:-1)*hd;
      cs.speed *= -0.3;
    }
  }
  playerCar3d.position.set(cs.x,0,cs.z);
  playerCar3d.rotation.y = cs.yaw;
  wheels3d.forEach(w=>{w.rotation.x += cs.speed*dt*2;});
  const gp = garagePromptArea;
  if(gp){
    const dg = Math.sqrt((cs.x-gp.x)**2+(cs.z-gp.z)**2);
    const pel = $('#garage-prompt');
    if(pel){
      if(dg<gp.radius && Math.abs(cs.speed)<12)pel.classList.add('show');
      else pel.classList.remove('show');
    }
  }
}
function updateCamera3d(){
  const cs = car3d;
  const dist = 11+Math.abs(cs.speed)*0.15;
  const h = 5.5+Math.abs(cs.speed)*0.05;
  const cx = cs.x-Math.sin(cs.yaw)*dist;
  const cz = cs.z-Math.cos(cs.yaw)*dist;
  camera3d.position.x += (cx-camera3d.position.x)*camLerp;
  camera3d.position.y += (h-camera3d.position.y)*camLerp;
  camera3d.position.z += (cz-camera3d.position.z)*camLerp;
  const shake = Math.abs(cs.speed)/55 * 0.15;
  camera3d.position.x += rnd(-shake, shake);
  camera3d.position.y += rnd(-shake, shake);
  camera3d.lookAt(cs.x+Math.sin(cs.yaw)*5, 1.4, cs.z+Math.cos(cs.yaw)*5);
}
function drawMinimap3d(){
  const cv = $('#minimap');if(!cv)return;
  const ctx = cv.getContext('2d');
  const W = cv.width = 220, H = cv.height = 220;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = 'rgba(15,20,35,.65)';
  ctx.fillRect(0,0,W,H);
  const sc = 0.55, cx = W/2, cy = H/2;
  ctx.fillStyle = '#444';
  ctx.fillRect(cx-7*sc,0,14*sc,H);
  ctx.fillRect(0,cy-7*sc,W,14*sc);
  ctx.fillStyle = '#8a94a4';
  buildings3d.forEach(b=>{ctx.fillRect(cx+b.x*sc-2, cy+b.z*sc-2, 5, 5);});
  ctx.fillStyle = '#3a7a3a';
  trees3d.forEach(t=>{ctx.beginPath();ctx.arc(cx+t.x*sc, cy+t.z*sc, 1.5, 0, Math.PI*2);ctx.fill();});
  ctx.fillStyle = '#3ecf8e';
  ctx.beginPath();ctx.arc(cx, cy-50*sc, 6, 0, Math.PI*2);ctx.fill();
  if(garagePromptArea){
    ctx.strokeStyle = 'rgba(62,207,142,.5)';
    ctx.beginPath();
    ctx.arc(cx+garagePromptArea.x*sc, cy+garagePromptArea.z*sc, garagePromptArea.radius*sc, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.save();
  ctx.translate(cx+car3d.x*sc, cy+car3d.z*sc);
  ctx.rotate(-car3d.yaw);
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.moveTo(0,-7);ctx.lineTo(-5,5);ctx.lineTo(5,5);ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function animate3d(){
  if(!scene3d)return;
  requestAnimationFrame(animate3d);
  const dt = Math.min(clock3d.getDelta(), 0.05);
  updateCar3d(dt);
  updateCamera3d();
  if(garageArrow3d){
    garageArrow3d.rotation.y += dt*2;
    garageArrow3d.position.y = 10 + Math.sin(Date.now()/400)*0.5;
  }
  clouds3d.forEach(c=>{

    if(c.position.x > 220) c.position.x = -220;
  });

  if(hm)hm.textContent = '💰 '+money(S.balance);

  if(hs)hs.innerHTML = Math.round(Math.abs(car3d.speed)*3.6*0.7)+' <small>км/ч</small>';

function setupControls3d(){
  const km = {'ArrowUp':'up','KeyW':'up','ArrowDown':'down','KeyS':'down','ArrowLeft':'left','KeyA':'left','ArrowRight':'right','KeyD':'right','Space':'gas','ShiftLeft':'brake'};
  document.addEventListener('keydown',e=>{const k=km[e.code];if(k){keys3d[k]=true;e.preventDefault();}});
  document.addEventListener('keyup',e=>{const k=km[e.code];if(k){keys3d[k]=false;e.preventDefault();}});
  document.querySelectorAll('[data-key]').forEach(btn=>{
    const k = btn.dataset.key;
    const press = e=>{e.preventDefault();keys3d[k]=true;};
    const rel = e=>{e.preventDefault();keys3d[k]=false;};
    btn.addEventListener('touchstart',press,{passive:false});
    btn.addEventListener('touchend',rel,{passive:false});
    btn.addEventListener('touchcancel',rel,{passive:false});
    btn.addEventListener('mousedown',press);
    btn.addEventListener('mouseup',rel);
    btn.addEventListener('mouseleave',rel);
  });
  window.addEventListener('resize',()=>{
    if(camera3d){camera3d.aspect = window.innerWidth/window.innerHeight; camera3d.updateProjectionMatrix();}
    if(renderer3d)renderer3d.setSize(window.innerWidth, window.innerHeight);
  });
}
function open3D(){
  const m2 = $('#mode-2d'), m3 = $('#mode-3d');
  if(m2)m2.classList.remove('active');
  if(m3)m3.classList.add('active');
  if(!selectedCity){
    const cp = $('#city-picker');
    if(cp){
      cp.classList.add('show');
      cp.querySelectorAll('[data-city]').forEach(btn => {
        btn.onclick = () => {
          selectedCity = btn.dataset.city;
          cp.classList.remove('show');
          buildCity();
        };
      });
    }
    return;
  }
  if(!mode3dStarted) buildCity();
  else animate3d();
}

      animate3d();
      updateCityTag();
      setTimeout(()=>{if(ld)ld.style.display='none';},400);
    }catch(err){
      console.error(err);
      const lt = $('#load-text');
      if(lt)lt.textContent = '❌ Ошибка: '+err.message;
    }
  },400);
}
function updateCityTag(){
  const names = {batareya:'🏙️ Батарея', varzamas:'🏭 Варзамас', rublevka:'💎 Рублёвка'};
  const tag = $('#city-tag');
  if(tag) tag.textContent = names[selectedCity] || '🏙️ Батарея';
}
function close3D(){
  const m2 = $('#mode-2d'), m3 = $('#mode-3d');
  if(m3)m3.classList.remove('active');
  if(m2)m2.classList.add('active');
  Object.keys(keys3d).forEach(k=>keys3d[k]=false);
  renderHomeHeader();
}
function showDevicePicker(){
  const p = $('#device-picker');if(!p)return;
  p.classList.add('show');
  p.querySelectorAll('[data-dev]').forEach(btn=>{
    btn.onclick = ()=>{
      S.deviceMode = btn.dataset.dev;
      document.body.setAttribute('data-device', S.deviceMode);
      save();
      p.classList.remove('show');
      startGame();
    };
  });
}
function startGame(){
  document.body.setAttribute('data-theme', S.theme||'dark');
  document.body.setAttribute('data-device', S.deviceMode || 'phone');
  document.body.setAttribute('data-cinema', S.cinema ? 'on' : 'off');
  buildApps();
  buildHome();
  if(S.offers.length===0){for(let i=0;i<5;i++)S.offers.push(genCar(pick(CAR_MODELS)));}
  if(!S.nextOfferAt)S.nextOfferAt = Date.now()+rndI(45,120)*1000;
  renderHomeHeader();
  updateClock();
  const safeOn = (sel, fn) => { const el = document.querySelector(sel); if(el) el.onclick = fn; };
  safeOn('#drive-btn', open3D);
  safeOn('#btn-home', close3D);
  safeOn('#garage-prompt', ()=>{close3D();setTimeout(()=>openApp('garage'),200);});
  safeOn('#btn-cinema', ()=>{
    S.cinema = !S.cinema;
    document.body.setAttribute('data-cinema', S.cinema ? 'on' : 'off');
    const btn = $('#btn-cinema');
    if(btn) btn.classList.toggle('on', S.cinema);
    toast(S.cinema ? '🎬 Кино ВКЛ' : '🎬 Кино ВЫКЛ');
    save();
  });
  setInterval(tick, 1000);
  setInterval(updateClock, 15000);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', ()=>{if(document.hidden)save();});
  setTimeout(()=>push('🎬 Добро пожаловать!','Нажми «Выехать в город» — выбери город','🏙️'),800);
  save();
}
function init(){
  S = load() || defaultState();
  document.body.setAttribute('data-theme', S.theme||'dark');
  document.body.setAttribute('data-cinema', S.cinema ? 'on' : 'off');
  if(!S.deviceMode){ showDevicePicker(); return; }
  document.body.setAttribute('data-device', S.deviceMode);
  startGame();
}
const mw = document.getElementById('modal-wrap');
if(mw) mw.addEventListener('click', e=>{if(e.target.id==='modal-wrap')closeModal();});
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
